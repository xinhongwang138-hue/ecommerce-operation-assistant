name: tests

# 只有一条流水线：装依赖 → 跑 pytest。
# 测试用内存 SQLite（见 api/tests/conftest.py），不需要 MySQL / Redis / PostgreSQL 服务容器。
# runner 选 windows 而不是 ubuntu：这套代码在 Windows 上开发与验收，pg_dump 路径、
# 文件分隔符相关用例在 POSIX 上行为不同，先保证「与本地一致」这条底线。

# 主开发在 feat/* 分支上，只写 master 的话推云端的提交永远不会触发；
# 合入 master 后再由 pull_request 兜一层。

on:
  push:
    branches: [master, "feat/**"]
  pull_request:
    branches: [master]

jobs:
  pytest:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: api

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: api/pyproject.toml

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Run tests
        run: pytest -q
